<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ẹsẹ · estudio de versos de Ifá</title>
<meta name="theme-color" content="#12301F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ẹsẹ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --bg:#12301F;          /* verde profundo */
  --panel:#183A28;
  --panel2:#1F4632;
  --rule:#2F5B44;
  --ink:#F0EAD2;         /* marfil */
  --muted:#A9BCAF;
  --gold:#EDBE3A;        /* amarillo: tono alto y acento */
  --low:#8DC9EA;         /* azul claro: tono bajo */
  --danger:#F0A48F;
  --on-gold:#15301F;
  --ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --yo:"Gentium Book Plus", "Gentium Plus", "Noto Serif", "Charis SIL", Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.yo{font-family:var(--yo)}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--panel2);border:1px solid var(--rule);border-radius:10px;padding:.55rem .95rem;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:.4rem .75rem;font-size:.93rem}
.btn.big{font-size:1.12rem;padding:.8rem 1.4rem}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}

/* Estructura general */
.wrap{max-width:52rem;margin:0 auto;padding:0 max(1.25rem,var(--sal)) max(1.25rem,var(--sab)) max(1.25rem,var(--sar))}
.bar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--rule);
  padding:calc(.85rem + var(--sat)) max(1.25rem,var(--sar)) .85rem max(1.25rem,var(--sal))}
.ttl{flex:1;min-width:10rem}
.ttl h2{margin:0;font-family:var(--yo);font-weight:700;font-size:1.3rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:.98rem}
.bar-actions{display:flex;gap:.45rem;flex-wrap:wrap}
.hint{color:var(--muted)}
.warn{color:var(--gold)}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin:1.5rem 0}

/* Biblioteca */
.masthead{padding:calc(3.2rem + var(--sat)) 0 .5rem}
.brand{font-family:var(--yo);font-weight:400;font-size:clamp(4.2rem,15vw,7.5rem);line-height:1.1;margin:0;padding-top:.45em;letter-spacing:-.01em}
.lede{font-size:1.2rem;color:var(--muted);max-width:30rem;margin:.4rem 0 0}
.lib{list-style:none;margin:0 0 4rem;padding:0;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:1fr auto;gap:.1rem 1.25rem;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:1.05rem .25rem;cursor:pointer}
.rt{font-size:1.4rem;font-weight:700;line-height:1.3}
.ro{color:var(--gold);grid-column:1;font-size:1.05rem}
.rs{grid-column:2;grid-row:1 / span 2;align-self:center;color:var(--muted);font-size:.92rem;text-align:right;max-width:13rem}
.row:hover .rt{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:.2em}
.empty{border:1px dashed var(--rule);border-radius:14px;padding:1.5rem;color:var(--muted);font-size:1.08rem;margin-bottom:3rem}
.empty p{margin:0}
.fine{color:var(--muted);font-size:.9rem}

/* Editor */
.form{display:grid;gap:1.4rem;padding:1.5rem 0 3rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.f{display:grid;gap:.45rem}
.f > span,.fh > span{font-weight:700}
.fh{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}
input[type=text],textarea,select{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:.7rem .85rem;width:100%}
textarea{resize:vertical;min-height:6rem}
textarea.yo,input.yo{font-size:1.2rem;line-height:1.65}
input::placeholder,textarea::placeholder{color:#7E9486}
.marks{display:flex;flex-wrap:wrap;gap:.35rem}
.mk{min-width:2.5rem;padding:.3rem .6rem;border:1px solid var(--rule);border-radius:8px;background:var(--panel2);font-family:var(--yo);font-size:1.15rem;cursor:pointer;line-height:1.3}
.mk:hover{border-color:var(--gold)}
.aurow{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}

/* Sílabas, tonos y melodía */
.syl{position:relative}
.player.tones .t-h{color:var(--gold)}
.player.tones .t-l{color:var(--low)}
.player.staff .ln.active .syl::before,
.player.staff .pline .syl::before,
.brand .syl::before{
  content:"";position:absolute;left:50%;top:var(--dy,-.6em);
  width:.2em;height:.2em;margin-left:-.1em;border-radius:50%;
  background:var(--ink);pointer-events:none}
.brand .syl::before{width:.1em;height:.1em;margin-left:-.05em;top:.06em;background:var(--gold)}
.t-h{--dy:-.94em}
.t-m{--dy:-.72em}
.t-l{--dy:-.50em}
.t-f{--dy:-.83em}
.player.tones.staff .ln.active .t-h::before,.player.tones.staff .pline .t-h::before{background:var(--gold)}
.player.tones.staff .ln.active .t-l::before,.player.tones.staff .pline .t-l::before{background:var(--low)}
.player.staff .ln.active .t-f::before{background:transparent;box-shadow:inset 0 0 0 .035em var(--ink)}

/* Reproductor */
.player{display:flex;flex-direction:column;height:100vh;height:100dvh}
.notice{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  padding:.75rem max(1.25rem,var(--sar)) .75rem max(1.25rem,var(--sal));background:var(--panel);border-bottom:1px solid var(--rule)}
.notice p{margin:0}
.loader{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;justify-content:space-between;width:100%}
.lyrics{flex:1;min-height:0;overflow-y:auto;position:relative}
.lyrics-in{padding:22vh max(1.25rem, var(--sar), calc((100% - 46rem) / 2)) 45vh max(1.25rem, var(--sal), calc((100% - 46rem) / 2))}
.ln{font-family:var(--yo);font-size:clamp(1.3rem,3.4vw,1.85rem);line-height:1.45;
  opacity:.34;padding:.45rem .75rem;margin:0 -.75rem;border-radius:12px;cursor:pointer;
  transition:opacity .3s ease, font-size .3s ease}
.ln.past{opacity:.62}
.ln:hover{opacity:.85}
.ln.active{opacity:1;font-size:clamp(1.8rem,5.2vw,2.8rem);line-height:1.3}
.player.staff .ln.active{line-height:2.4;padding-top:.8em}
.ln.loop{box-shadow:inset 3px 0 0 var(--gold)}
.ln .tr{display:none;font-family:var(--ui);font-size:1rem;line-height:1.4;color:var(--muted);margin-top:.2rem}
.player.show-tr .ln .tr{display:block}
.ln.active .tr{font-size:1.1rem;color:var(--ink);opacity:.8}
.stanza{height:1.6rem}
/* modos de memorización */
.player.mode-ini .ln.hid .w .c:not(:first-child),
.player.mode-hid .ln.hid .c{
  color:transparent;text-decoration:underline;text-decoration-color:rgba(240,234,210,.4);
  text-decoration-thickness:2px;text-underline-offset:.2em}
.player.mode-ini .ln.hid .tr,.player.mode-hid .ln.hid .tr{visibility:hidden}

.dock{border-top:1px solid var(--rule);background:var(--panel);
  padding:.8rem max(1rem, var(--sar), calc((100% - 52rem) / 2)) calc(.8rem + var(--sab)) max(1rem, var(--sal), calc((100% - 52rem) / 2))}
.transport{display:flex;align-items:center;gap:.75rem}
.play{width:50px;height:50px;border-radius:50%;background:var(--gold);color:var(--on-gold);border:0;display:grid;place-items:center;cursor:pointer;flex:none}
.play:hover{filter:brightness(1.07)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:2.7rem;font-size:.95rem;text-align:center}
.seek{flex:1;position:relative;height:30px;display:flex;align-items:center}
.ticks{position:absolute;left:8px;right:8px;top:50%;height:14px;transform:translateY(-50%);pointer-events:none}
.ticks::before{content:"";position:absolute;left:0;right:0;top:5px;height:4px;border-radius:2px;background:var(--rule)}
.ticks .fill{position:absolute;left:0;top:5px;height:4px;border-radius:2px;background:var(--gold);width:0}
.ticks .intro{display:none;position:absolute;left:0;top:3px;height:8px;border-radius:2px;
  background:repeating-linear-gradient(135deg, rgba(169,188,175,.55) 0 2px, transparent 2px 6px)}
.player.skip-intro .ticks .intro{display:block}
.ticks i{position:absolute;top:0;width:2px;height:14px;margin-left:-1px;background:var(--muted);opacity:.55;border-radius:1px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;position:relative;z-index:1;margin:0;height:30px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{background:transparent;height:30px}
input[type=range]::-moz-range-track{background:transparent;height:30px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);margin-top:7px;border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0}
.speed select{width:auto;padding:.4rem .5rem;font-size:.95rem}
.opts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:.75rem}
.chip{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:.38rem .85rem;font-size:.93rem;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:rgba(237,190,58,.13)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.38rem .85rem;color:var(--muted);cursor:pointer;font-size:.93rem}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);font-weight:700}
.legend{margin-left:auto;display:flex;align-items:center;color:var(--muted);font-size:.86rem;gap:.2rem}
.legend .k{width:.62rem;height:.62rem;border-radius:50%;display:inline-block;margin:0 .15rem 0 .55rem}
.k.h{background:var(--gold)} .k.m{background:var(--ink)} .k.l{background:var(--low)}
.player:not(.tones) .legend{display:none}
.keys{margin:.6rem 0 0;color:var(--muted);font-size:.84rem}

/* Sincronizar */
.sync-head{position:sticky;top:0;z-index:2;background:var(--bg);padding:1rem 0 .6rem;border-bottom:1px solid var(--rule)}
.synclist{padding-bottom:calc(5rem + var(--sab))}
.help{color:var(--muted);margin:0 0 .9rem;max-width:44rem}
.help b{color:var(--ink)}
.markrow{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.9rem}
.synclist{list-style:none;padding:0;margin:.8rem 0 5rem}
.synclist li{display:grid;grid-template-columns:1.8rem 5.4rem 1fr auto;gap:.7rem;align-items:center;padding:.5rem .6rem;border-radius:10px;border:1px solid transparent}
.synclist .num{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:.9rem}
.synclist .sl{font-family:var(--yo);font-size:1.22rem;line-height:1.45;color:var(--muted)}
.synclist li.done .sl{color:var(--ink)}
.synclist li.next{border-color:var(--gold);background:rgba(237,190,58,.08)}
.synclist li.next .sl{color:var(--ink)}
.synclist li.playing{background:var(--panel2)}
.stamp{font-variant-numeric:tabular-nums;background:transparent;border:1px solid var(--rule);border-radius:8px;padding:.25rem .4rem;color:var(--muted);cursor:pointer}
.synclist li.done .stamp{color:var(--ink)}
.nudge{display:flex;gap:.25rem}
.nb{border:1px solid var(--rule);background:transparent;border-radius:8px;padding:.2rem .45rem;font-size:.85rem;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.nb:hover{color:var(--ink)}
.nb[disabled]{visibility:hidden}

#toast{visibility:hidden;position:fixed;left:50%;top:calc(.6rem + var(--sat));transform:translate(-50%,-160%);background:var(--ink);color:var(--on-gold);padding:.65rem 1.05rem;border-radius:10px;z-index:50;max-width:min(92vw,36rem);font-weight:700;transition:transform .25s ease;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.show{visibility:visible;transform:translate(-50%,0)}

/* Fondo vivo: tres luces suaves que se mueven lento y reaccionan a la voz */
.aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.player > .bar,.player > .notice,.player > .lyrics,.player > .dock{position:relative;z-index:1}
.player:not(.aura-on) .aura{display:none}
.aura .orb{position:absolute;width:70vmax;height:70vmax;will-change:transform}
.aura .orb i{position:absolute;inset:0;border-radius:50%;
  transform:scale(calc(.9 + var(--lvl, 0) * .45));opacity:calc(.5 + var(--lvl, 0) * .8);
  transition:transform .3s ease-out,opacity .3s ease-out}
.orb.o1{left:-22vmax;top:-28vmax;animation:drift1 38s ease-in-out infinite alternate}
.orb.o1 i{background:radial-gradient(circle, rgba(237,190,58,.22), rgba(237,190,58,0) 62%)}
.orb.o2{right:-28vmax;top:8vh;animation:drift2 52s ease-in-out infinite alternate}
.orb.o2 i{background:radial-gradient(circle, rgba(98,178,126,.24), rgba(98,178,126,0) 62%)}
.orb.o3{left:5vw;bottom:-40vmax;animation:drift3 66s ease-in-out infinite alternate}
.orb.o3 i{background:radial-gradient(circle, rgba(141,201,234,.14), rgba(141,201,234,0) 62%)}
@keyframes drift1{to{transform:translate(20vmax,16vmax)}}
@keyframes drift2{to{transform:translate(-18vmax,20vmax)}}
@keyframes drift3{to{transform:translate(16vmax,-14vmax)}}
.player.turn .aura .orb i{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

/* Práctica: eco y cadena */
.pausew select{width:auto;padding:.35rem .5rem;font-size:.92rem;border-radius:999px}
.player.pr-free .pausew{display:none}
.pstat{color:var(--ink);font-size:.95rem}
.player.turn .pstat{color:var(--gold);font-weight:700}
.ln.inchain{box-shadow:inset 3px 0 0 rgba(237,190,58,.5)}
.ln.active::after{content:"";display:block;height:3px;border-radius:2px;margin-top:.4rem;
  background:var(--gold);width:calc(var(--turn, 0) * 100%);opacity:0}
.player.turn .ln.active::after{opacity:1}
.view-opts{padding-top:.6rem;border-top:1px dashed var(--rule)}
.chip[disabled]{opacity:.4;cursor:default}

/* Karaoke por palabra */
.player.karaoke .ln.active .w{opacity:.42;transition:opacity .15s ease}
.player.karaoke .ln.active .w.sung{opacity:1}

/* Notas estilo Genius */
.w.has-note{border-bottom:2px dotted var(--gold);cursor:help}
.nmark{background:transparent;border:0;color:var(--gold);cursor:pointer;padding:0 .2em;margin-left:.15em;font-size:.62em;line-height:1;vertical-align:super}
.nmark svg{width:1em;height:1em;display:inline-block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(26rem,40vw);background:var(--panel);border-left:1px solid var(--rule);z-index:20;display:flex;flex-direction:column;visibility:hidden;transform:translateX(100%);transition:transform .25s ease,visibility 0s linear .25s}
.panel.open{visibility:visible;transform:none;transition:transform .25s ease}
.ph{display:flex;align-items:center;justify-content:space-between;gap:.5rem;border-bottom:1px solid var(--rule);color:var(--muted);
  padding:calc(.75rem + var(--sat)) max(1rem,var(--sar)) .75rem max(1rem,var(--sal))}
@media (max-width:999px){ .ph{padding-top:.75rem} }
.pnav{display:flex;gap:.3rem}
.pbody{overflow-y:auto;flex:1;padding:1rem max(1.15rem,var(--sar)) calc(2.5rem + var(--sab)) max(1.15rem,var(--sal))}
.pline{font-size:1.6rem;line-height:1.7;margin:.2rem 0 .5rem}
.player.staff .pline{line-height:2.4;padding-top:.6em}
.pw{background:transparent;border:0;border-bottom:2px solid transparent;padding:0 .06em;cursor:pointer;font:inherit;color:inherit;border-radius:4px}
.pw:hover{background:rgba(240,234,210,.08)}
.pw.has{border-bottom:2px dotted var(--gold)}
.pw.sel{background:rgba(237,190,58,.17);border-bottom:2px solid var(--gold)}
.ptr{color:var(--muted);margin:0 0 .6rem;font-size:1.02rem}
.psec{border-top:1px solid var(--rule);padding-top:.9rem;margin-top:.9rem}
.psec h3{font-size:1rem;margin:0 0 .6rem}
.psec h3 .yo{font-size:1.25rem}
.ntext{font-size:1.03rem;line-height:1.6;margin-bottom:.75rem}
.nedit{font-size:1rem;line-height:1.55}
.nact{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.55rem}
@media (min-width:1000px){ .player.panel-open{padding-right:min(26rem,40vw)} }
@media (max-width:999px){
  .panel{top:auto;left:0;width:auto;height:min(72vh, calc(100dvh - 5rem - var(--sat)));border-left:0;border-top:1px solid var(--rule);border-radius:16px 16px 0 0;transform:translateY(100%)}
}

@media (max-width:640px){
  .two{grid-template-columns:1fr}
  .legend{margin-left:0}
  .keys{display:none}
  .dock{max-height:46dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .dock .opts{flex-wrap:wrap}
  .dock .pstat{flex:1 1 auto;white-space:normal}
  .chip,.seg button{padding:.5rem .8rem;font-size:.9rem;min-height:40px;display:inline-flex;align-items:center}
  .btn.sm{min-height:40px}
  .play{width:56px;height:56px}
  .row{padding:1.15rem .25rem}
  .dock .opts{margin-top:.55rem;gap:.4rem}
  .transport{flex-wrap:wrap;row-gap:.35rem}
  .seek{order:5;flex-basis:100%}
  .speed{margin-left:auto}
  .synclist li{grid-template-columns:1.4rem 4.9rem 1fr;}
  .synclist .nudge{grid-column:2 / span 2}
  .rs{max-width:8rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .aura .orb,.player.turn .aura .orb i{animation:none}
}
</style>

<script>
(function(){
"use strict";

/* ---------- utilidades ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const app = $('#app');
/* ---------- motor de audio (Web Audio) ----------
   Dentro de Claude, el reproductor HTML no puede abrir archivos locales (el visor los bloquea),
   así que el audio se decodifica y se reproduce con Web Audio. Para las velocidades lentas se
   estira el tiempo sin cambiar el tono (WSOLA), importante para oír bien los tonos del yorùbá. */
function makeBuffer(data, rate){
  let b;
  try { b = new AudioBuffer({ length: Math.max(1, data.length), sampleRate: rate, numberOfChannels: 1 }); }
  catch(e){ b = new OfflineAudioContext(1, 1, rate).createBuffer(1, Math.max(1, data.length), rate); }
  b.getChannelData(0).set(data); return b;
}
async function timeStretch(x, r){
  const W = 1024, Hs = 512, Ha = Hs * r, tol = 256, N = x.length;
  const outLen = Math.ceil(N / r), out = new Float32Array(outLen + W);
  const win = new Float32Array(W);
  for (let i = 0; i < W; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / W);
  let prev = 0;
  for (let k = 0; ; k++){
    const nominal = Math.round(k * Ha);
    if (nominal > N - W) break;
    let best = nominal;
    if (k > 0){
      const tgt = prev + Hs, jmax = Math.min(W, N - tgt);
      const lo = Math.max(0, nominal - tol), hi = Math.min(N - W, nominal + tol);
      let bestScore = -Infinity;
      for (let c = lo; c <= hi; c += 2){
        let s = 0;
        for (let j = 0; j < jmax; j += 8) s += x[tgt + j] * x[c + j];
        if (s > bestScore){ bestScore = s; best = c; }
      }
    }

/* ---------- conversión de audio (videos y archivos pesados) ---------- */
const LAME_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';
const LIMIT_BYTES = 3.5 * 1048576;
const DECODE_FAIL = 'Este navegador no pudo leer el audio de ese archivo. Prueba en Chrome o Safari, o conviértelo a MP3 o M4A antes de subirlo.';
const tick = () => new Promise(r => setTimeout(r, 0));
const isVideoFile = f => /^video\//.test(f.type) || /\.(mp4|m4v|mov|3gp|mkv)$/i.test(f.name);
const baseName = n => n.replace(/\.[^.]+$/, '') || 'audio';

async function decodeMono(file){
  const buf = await file.arrayBuffer();
  const ctx = new OfflineAudioContext(1, 1, 44100);
  const ab = await new Promise((res, rej) => ctx.decodeAudioData(buf, res, rej));
  const n = ab.length, chs = ab.numberOfChannels, mono = new Float32Array(n);
  for (let c = 0; c < chs; c++){ const d = ab.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / chs; }
  return { mono, rate: ab.sampleRate };
}
function toInt16(f32){
  const out = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++){ const s = Math.max(-1, Math.min(1, f32[i])); out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF; }
  return out;
}
async function encodeMp3(mono, rate, name, progress){
  if (!window.lamejs) await loadScript(LAME_SRC);
  const enc = new window.lamejs.Mp3Encoder(1, rate, 64);
  const pcm = toInt16(mono), block = 1152, parts = [];
  for (let i = 0; i < pcm.length; i += block){
    const out = enc.encodeBuffer(pcm.subarray(i, i + block));
    if (out.length) parts.push(new Int8Array(out));
    if (i % (block * 300) === 0){ progress(i / pcm.length); await tick(); }
  }
  const end = enc.flush(); if (end.length) parts.push(new Int8Array(end));
  return new File(parts, baseName(name) + '.mp3', { type:'audio/mpeg' });
}
function encodeWav16k(mono, rate, name){
  const target = 16000, ratio = rate / target, len = Math.floor(mono.length / ratio);
  const pcm = new Int16Array(len);
  for (let i = 0; i < len; i++){
    const a = Math.floor(i * ratio), b = Math.min(mono.length, Math.floor((i + 1) * ratio));
    let s = 0; for (let k = a; k < b; k++) s += mono[k]; s /= Math.max(1, b - a);
    s = Math.max(-1, Math.min(1, s)); pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  const hdr = new DataView(new ArrayBuffer(44)), w = (o, str) => { for (let i = 0; i < 4; i++) hdr.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); hdr.setUint32(4, 36 + len * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  hdr.setUint32(16, 16, true); hdr.setUint16(20, 1, true); hdr.setUint16(22, 1, true);
  hdr.setUint32(24, target, true); hdr.setUint32(28, target * 2, true); hdr.setUint16(32, 2, true); hdr.setUint16(34, 16, true);
  w(36, 'data'); hdr.setUint32(40, len * 2, true);
  return new File([hdr.buffer, pcm.buffer], baseName(name) + '.wav', { type:'audio/wav' });
}
// Devuelve un archivo listo para usar. Los videos y los audios de más de 3.5 MB se convierten a MP3 mono ligero.
async function prepareAudio(file, status){
  const video = isVideoFile(file);
  if (!video && file.size <= LIMIT_BYTES) return { file, note:'' };
  status(video ? 'Extrayendo el audio del video…' : 'Comprimiendo el audio para que quepa en el almacenamiento…');
  let dec;
  try { dec = await decodeMono(file); } catch(e){ return { file, note: 'decode-fail' }; }
  try {
    const mp3 = await encodeMp3(dec.mono, dec.rate, file.name, p => status(`Convirtiendo el audio… ${Math.round(p * 100)}%`));
    status('Verificando el MP3…');
    const chk = await decodeMono(mp3);   // si el MP3 salió dañado, se usa WAV
    if (chk.mono.length < dec.mono.length * 0.9) throw new Error('MP3 incompleto');
    return { file: mp3, note:'mp3' };
  } catch(e){
    console.warn('MP3 no disponible, se usa WAV', e);
    return { file: encodeWav16k(dec.mono, dec.rate, file.name), note:'wav' };
  }
}

function introEnd(){

function seekBy(s){ if (!S.srcId) return; audio.currentTime = Math.max(0, Math.min((audio.duration || 0), audio.currentTime + s)); frame(); }

function activeAt(t, times){ let a = -1; for (let i = 0; i < times.length; i++){ const x = times[i]; if (x != null && x <= t + 0.02) a = i; } return a; }
function nextStart(times, i){ for (let j = i + 1; j < times.length; j++) if (times[j] != null) return times[j]; return null; }

function frame(){
  const t = audio.currentTime, d = audio.duration || 0;
  const tc = $('#tcur'); if (tc) tc.textContent = fmt(t);
  const sk = $('#seek'); if (sk && !S.dragging && d) sk.value = Math.round(t / d * 1000);

  } else if (S.view === 'sync'){
    const a = activeAt(t, v.times);

  }
}

    <div class="pbody">
      <p class="pline yo">${words.map((w, k) => `<button class="pw${v.notes.words[i + ':' + k] ? ' has' : ''}${k === j ? ' sel' : ''}" data-j="${k}" aria-pressed="${k === j}">${clusterHTML(w)}</button>`).join(' ')}</p>
      ${trs[i] ? `<p class="ptr">${esc(trs[i])}</p>` : ''}
      <section class="psec"><h3>Nota de la línea</h3>${block('line', lnote)}</section>
      <section class="psec"><h3>${j != null ? `Palabra <span class="yo">${esc(words[j])}</span>` : 'Notas por palabra'}</h3>
        ${j != null ? block('word', wnote) : '<p class="hint">Toca una palabra de la línea para ver o escribir su nota. Las que ya tienen nota llevan un subrayado punteado.</p>'}</section>
    </div>`;
  $('#p-close').addEventListener('click', closeNotes);
  $('#p-prev').addEventListener('click', () => { S.panel = { i: i - 1, j: null, edit: null }; renderPanel(); });
  $('#p-next').addEventListener('click', () => { S.panel = { i: i + 1, j: null, edit: null }; renderPanel(); });
  $$('.pw', p).forEach(b => b.addEventListener('click', () => {
    const k = +b.dataset.j; S.panel.j = (S.panel.j === k ? null : k); S.panel.edit = null; renderPanel();
  }));
  $$('[data-edit]', p).forEach(b => b.addEventListener('click', () => {
    S.panel.edit = b.dataset.edit; if (!audio.paused) audio.pause();
    renderPanel(); const t = $('#n-text'); if (t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
  }));
  const sv = $('#n-save');
  if (sv){
    const key = edit === 'line' ? null : i + ':' + j;
    const put = val => {
      if (edit === 'line'){ if (val) v.notes.lines[i] = val; else delete v.notes.lines[i]; }
      else { if (val) v.notes.words[key] = val; else delete v.notes.words[key]; }
    };
    sv.addEventListener('click', async () => {
      const val = $('#n-text').value.trim().normalize('NFC');
      put(val); S.panel.edit = null; await saveVerse(v); refreshLine(i); renderPanel();
      toast(val ? 'Nota guardada.' : 'Nota borrada.');
    });
    $('#n-cancel').addEventListener('click', () => { S.panel.edit = null; renderPanel(); });
    const del = $('#n-del');
    if (del){
      let armed = false;
      del.addEventListener('click', async () => {
        if (!armed){ armed = true; del.textContent = 'Confirmar: borrar nota'; return; }
        put(''); S.panel.edit = null; await saveVerse(v); refreshLine(i); renderPanel(); toast('Nota borrada.');
      });
    }
  }
}

/* ---------- exportar / importar ---------- */
function download(obj, name){
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj)], { type:'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000);
}
async function verseData(v){
  let au = null;
  if (v.audioStored) au = await loadAudio(v.id);
  if (!au && S.sessionAudio[v.id]){
    try { au = { name: v.audioName || 'audio', data: await readDataURL(S.sessionAudio[v.id]) }; } catch(e){}
  }
  return { id:v.id, title:v.title, odu:v.odu, text:v.text, translation:v.translation,
    times:v.times, words:v.words || null, notes:v.notes || {}, audio:au };
}
async function exportVerse(v){
  const d = await verseData(v);
  download({ formato:'ese-ifa', version:2, ...d }, slug(v.title || 'verso') + '.json');
  toast(d.audio ? 'Verso exportado con su audio.' : 'Verso exportado (sin audio).');
}
// Respaldo completo: todos los versos con su audio, sus marcas y sus notas, en un archivo.
async function exportLibrary(){
  const b = $('#backup') || $('#bk2'); if (b){ b.disabled = true; b.textContent = 'Preparando…'; }
  const versos = [];
  let sinAudio = 0;
  for (const x of S.index){
    const v = await openVerse(x.id); if (!v) continue;
    const d = await verseData(v); if (!d.audio) sinAudio++;
    versos.push(d);
    if (b) b.textContent = `Preparando… ${versos.length}/${S.index.length}`;
  }
  const hoy = new Date().toISOString().slice(0, 10);
  download({ formato:'ese-ifa-biblioteca', version:1, fecha:hoy, versos }, `versos-ifa-${hoy}.json`);
  if (b){ b.disabled = false; b.textContent = 'Respaldar biblioteca'; }
  toast(`Respaldo de ${versos.length} ${versos.length === 1 ? 'verso' : 'versos'}` +
        (sinAudio ? `, ${sinAudio} sin audio.` : ' con sus audios.'));
}
async function importVerse(d, silencio){
    const existing = typeof d.id === 'string' && S.index.some(x => x.id === d.id);
    const old = existing ? await store.get('verso:' + d.id) : null;
    const num = x => typeof x === 'number' && isFinite(x) ? x : null;
    const v = { id: existing ? d.id : newId(), title:String(d.title || ''), odu:String(d.odu || ''), text:d.text.normalize('NFC'),
      translation:String(d.translation || ''), times:Array.isArray(d.times) ? d.times.map(num) : [],
      words: Array.isArray(d.words) ? d.words.map(r => Array.isArray(r) ? r.map(pq => Array.isArray(pq) && num(pq[0]) != null ? [pq[0], num(pq[1]) ?? pq[0]] : null) : []) : null,
      notes: (d.notes && typeof d.notes === 'object') ? d.notes : (old && old.notes) || {},
      audioName: old ? old.audioName || '' : '', audioStored: old ? !!old.audioStored : false };
    if (d.audio && typeof d.audio.data === 'string'){
      v.audioName = d.audio.name || 'audio'; S.sessionAudio[v.id] = dataToBlob(d.audio.data);
      v.audioStored = d.audio.data.length < MAX_AUDIO_CHARS ? await saveAudio(v.id, v.audioName, d.audio.data) : false;
    }
    if (S.srcId === v.id) S.srcId = null;
    fitTimes(v);
    const ok = await saveVerse(v, silencio);
    return { v, existing, ok, error: ok ? '' : (store.lastError || 'razón desconocida') };
}
async function importFile(file){
  let d;
  try { d = JSON.parse(await file.text()); }
  catch(e){ toast('Ese archivo no se pudo leer como respaldo de esta herramienta.'); return; }
  try {
    if (Array.isArray(d.versos)){                      // respaldo de biblioteca completa
      const lista = d.versos.filter(x => x && typeof x.text === 'string');
      if (!lista.length) throw new Error('vacío');
      let nuevos = 0, act = 0, fallos = [], sinAudio = 0;
      S.importLog = null;
      for (const x of lista){
        const r = await importVerse(x, true);
        if (!r.ok){ fallos.push(`${x.title || 'sin título'}: ${r.error}`); continue; }
        if (x.audio && !r.v.audioStored) sinAudio++;
        r.existing ? act++ : nuevos++;
      }
      if (fallos.length) S.importLog = { fallos, sinAudio, fecha: Date.now() };
      viewLibrary();
      let m = `Importados ${nuevos + act} de ${lista.length}.`;
      if (sinAudio) m += ` ${sinAudio} sin audio guardado.`;
      if (fallos.length) m += ` ${fallos.length} no se guardaron: abre Almacenamiento.`;
      toast(m);
      return;
    }
    if (typeof d.text !== 'string') throw new Error('formato');
    const { v, existing, ok, error } = await importVerse(d);
    if (!ok){ toast(`No se pudo guardar el verso: ${error}.`); viewLibrary(); return; }
    toast(existing ? 'Verso actualizado con los datos del archivo.' : 'Verso importado.');
    viewPlayer(v);
  } catch(e){ toast('Ese archivo no es un verso ni un respaldo de esta herramienta.'); }
}

/* ---------- almacenamiento: revisión y reparación ---------- */
const MB = b => (b / 1048576).toFixed(1) + ' MB';
const DONDE = {
  claude: 'Dentro de Claude, en esta conversación.',
  idb: 'En la base de datos de este navegador, en este dispositivo.',
  local: 'En el almacén simple del navegador. Cabe poco: los audios grandes no se guardan.',
  memoria: 'En ningún lado: este navegador no permite guardar y todo se pierde al cerrar.'
};
async function revisar(){
  const r = { ok:[], rotos:[], sinAudio:[], audio:0 };
  for (const x of S.index){
    const v = await store.get('verso:' + x.id);
    if (!v){ r.rotos.push(x); continue; }
    r.ok.push(x);
    if (v.audioStored){
      const a = await loadAudio(v.id);
      if (a && a.data) r.audio += a.data.length; else r.sinAudio.push(x);
    } else if (!S.sessionAudio[x.id]) r.sinAudio.push(x);
  }
  return r;
}
async function viewStorage(){
  stopPractice(); audio.pause(); S.view = 'storage';
  app.innerHTML = `<div class="bar"><button class="btn ghost" id="back">Biblioteca</button>
    <div class="ttl"><h2>Almacenamiento</h2><span class="sub">Dónde están tus versos y qué falta</span></div></div>
    <main class="wrap"><p class="help" id="dg">Revisando…</p></main>`;
  $('#back').addEventListener('click', viewLibrary);
  const r = await revisar(), esp = await store.espacio();
  const li = xs => xs.map(x => `<li class="fine">${esc(x.title || 'Sin título')}${x.odu ? ' · ' + esc(x.odu) : ''}</li>`).join('');
  $('#dg').outerHTML = `<div class="form">
    <section><h3>Dónde se guarda</h3>
      <p class="hint">${DONDE[store.backend]}</p>
      ${esp ? `<p class="hint">Espacio usado por esta app y el navegador: ${MB(esp.usado)} de ${MB(esp.total)} disponibles.</p>` : ''}
      ${r.audio ? `<p class="hint">Audio guardado: unos ${MB(r.audio * 0.75)}.</p>` : ''}
      ${store.lastError ? `<p class="warn">Último problema: ${esc(store.lastError)}</p>` : ''}
    </section>
    <section><h3>Versos</h3>
      <p class="hint">${r.ok.length} de ${S.index.length} se abren bien.</p>
      ${r.rotos.length ? `<p class="warn">${r.rotos.length} aparecen en la lista pero no están guardados:</p><ul>${li(r.rotos)}</ul>
        <div class="nact"><button class="btn danger" id="fix">Quitarlos de la lista</button></div>
        <p class="fine">Vuelve a importarlos del respaldo. Si el problema fue falta de espacio, importa menos versos a la vez o usa audios más cortos.</p>` : ''}
      ${r.sinAudio.length ? `<p class="hint">Sin audio guardado (el texto sí está):</p><ul>${li(r.sinAudio)}</ul>` : ''}
    </section>
    ${S.importLog ? `<section><h3>Última importación</h3><ul>${S.importLog.fallos.map(f => `<li class="fine">${esc(f)}</li>`).join('')}</ul></section>` : ''}
    <div class="actions">
      ${S.index.length ? '<button class="btn primary" id="bk2">Respaldar biblioteca</button>' : ''}
      <button class="btn" id="re">Revisar otra vez</button>
    </div>
  </div>`;
  const fix = $('#fix');
  if (fix) fix.addEventListener('click', async () => {
    const rotos = new Set(r.rotos.map(x => x.id));
    S.index = S.index.filter(x => !rotos.has(x.id));
    await store.set('versos:index', S.index);
    S.importLog = null;
    toast('Lista reparada.'); viewStorage();
  });
  const bk2 = $('#bk2'); if (bk2) bk2.addEventListener('click', exportLibrary);
  $('#re').addEventListener('click', viewStorage);
}

/* ---------- teclado ---------- */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if ((tag === 'textarea' || tag === 'select' || (tag === 'input' && e.target.type !== 'range'))) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.view === 'player'){
    if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowDown'){ e.preventDefault(); stepLine(1); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); stepLine(-1); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); seekBy(3); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); seekBy(-3); }
    else if (e.key === 'l' || e.key === 'L') toggleLoop();
    else if (e.key === 'r' || e.key === 'R') reveal();
    else if (e.key === 'n' || e.key === 'N'){ S.panel ? closeNotes() : openNotes(S.active, null); }
    else if (e.key === 'Escape'){ if (S.panel) closeNotes(); else if (P.s){ stopPractice(); audio.pause(); } }
  } else if (S.view === 'sync'){
    if (e.code === 'Space'){ e.preventDefault(); mark(true); }
    else if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace'){ e.preventDefault(); undo(); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); seekBy(3); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); seekBy(-3); }
  }
});
// Evita que la barra espaciadora también "haga clic" en el botón enfocado
document.addEventListener('keyup', e => {
  if (e.code === 'Space' && (S.view === 'player' || S.view === 'sync') && (e.target.tagName || '').toLowerCase() === 'button') e.preventDefault();
}, true);

/* ---------- sin conexión ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- inicio ---------- */
(async function init(){
  await store.init();
  const p = await store.get('prefs'); if (p) Object.assign(S.prefs, p);
  S.index = (await store.get('versos:index')) || [];
  viewLibrary();
})();
})();
</script>
